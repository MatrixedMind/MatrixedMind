name: Deploy development

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push, and deploy
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development
    env:
      GCP_ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

    steps:
      - name: Require deployment configuration
        run: |
          required_values=(
            "$GCP_ARTIFACT_REGISTRY_REPOSITORY"
            "$GCP_CLOUD_RUN_SERVICE"
            "$GCP_DEPLOYER_SERVICE_ACCOUNT"
            "$GCP_PROJECT_ID"
            "$GCP_REGION"
            "$GCP_WORKLOAD_IDENTITY_PROVIDER"
          )
          for value in "${required_values[@]}"; do
            if [[ -z "$value" ]]; then
              echo "::error::The development deployment variables are incomplete."
              exit 1
            fi
          done

      - name: Check out verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push immutable image
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          image_uri="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REGISTRY_REPOSITORY}/matrixedmind:${VERIFIED_SHA}"
          docker build --tag "$image_uri" .
          docker push "$image_uri"
          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run revision
        run: >-
          gcloud run services update "$GCP_CLOUD_RUN_SERVICE"
          --project="$GCP_PROJECT_ID"
          --region="$GCP_REGION"
          --image="$IMAGE_URI"
          --quiet

      - name: Verify health and hosted persistence readiness
        run: |
          service_url="$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.url)')"
          identity_token="$(gcloud auth print-identity-token \
            --impersonate-service-account="$GCP_DEPLOYER_SERVICE_ACCOUNT" \
            --audiences="$service_url" \
            --include-email)"
          curl --fail --show-error --silent --retry 6 --retry-all-errors \
            --header "Authorization: Bearer $identity_token" "$service_url/health"
          curl --fail --show-error --silent --retry 6 --retry-all-errors \
            --header "Authorization: Bearer $identity_token" "$service_url/ready"
