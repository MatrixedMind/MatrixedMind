{% extends "base.html" %}

{% block content %}
    <article>
        <h1>{{ record.title }}</h1>
        <div class="metadata">
            Space: {{ record.space }} | Slug: {{ record.slug }}
        </div>
        <p><a href="/{{ record.space }}/{{ record.slug }}/edit">Edit</a></p>
        <hr>
        <div class="content">
            {{ content_html | safe }}
        </div>
    </article>
{% endblock %}
