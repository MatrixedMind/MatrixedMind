{% extends "base.html" %}

{% block content %}
    <section class="auth-panel" aria-labelledby="password-heading">
        <p class="eyebrow">Owner settings</p>
        <h1 id="password-heading">Change owner password</h1>
        <p>Your current browser stays signed in. Every other browser session is revoked.</p>
        {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
        <form method="post" action="/settings/password">
            <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
            <label for="current_password">Current password</label>
            <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
            <label for="password">New password</label>
            <input id="password" name="password" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required>
            <label for="password_confirmation">Confirm new password</label>
            <input id="password_confirmation" name="password_confirmation" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required>
            <button type="submit">Change password</button>
        </form>
    </section>
{% endblock %}
