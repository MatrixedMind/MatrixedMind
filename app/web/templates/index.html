{% extends "base.html" %}

{% block content %}
    <h1>MatrixedMind</h1>
    <p>Your Mind in this MatrixedMind Instance.</p>
    <p><a class="button" href="/records/new">New Page</a></p>

    <h2>Recent Pages <small>in the default Space</small></h2>
    <ul>
    {% for record in records %}
        <li><a href="/{{ record.space }}/{{ record.slug }}">{{ record.title }}</a></li>
    {% else %}
        <li>No pages yet.</li>
    {% endfor %}
    </ul>
{% endblock %}
