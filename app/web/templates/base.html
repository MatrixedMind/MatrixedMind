<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="{{ robots_content | default('noindex,nofollow,noarchive') }}">
    <title>{% block title %}{{ title }}{% endblock %}</title>
    <link rel="stylesheet" href="/static/matrixedmind.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">MatrixedMind</a>
        <nav aria-label="Primary navigation">
            {% if request.state.browser_session %}
                <a href="/">Mind</a>
                <a href="/records/new">New Page</a>
                <a href="/settings/password">Password</a>
                <form class="inline-form" method="post" action="/logout">
                    <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
                    <button class="link-button" type="submit">Sign out</button>
                </form>
            {% else %}
                <a href="/login">Sign in</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <small>
            MatrixedMind is licensed under the GNU Affero General Public License v3.0.
            <a href="{{ source_offer_url }}">Source for this version</a>.
        </small>
    </footer>
</body>
</html>
